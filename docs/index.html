<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zuno — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --purple: #2E0B8C;
    --orange: #FF6A00;
    --bg: #F7F7F5;
    --surface: #FFFFFF;
    --border: #E5E3DC;
    --text: #1A1A1A;
    --text-secondary: #6B6A63;
    --text-muted: #9B998F;
    --danger: #E24B4A;
    --success: #1D9E75;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .topbar {
    background: var(--purple);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
  .logo-icon {
    width: 26px; height: 26px; border-radius: 7px; background: var(--orange);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
  }
  .logout-btn { background: none; border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; }

  #login-screen {
    max-width: 380px; margin: 80px auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 32px;
  }
  #login-screen h1 { font-size: 18px; margin: 0 0 4px; }
  #login-screen p { color: var(--text-secondary); font-size: 13px; margin: 0 0 20px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; margin-bottom: 10px;
  }
  button.primary {
    width: 100%; padding: 11px; border: none; border-radius: 8px; background: var(--orange);
    color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  #login-error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }

  #app { display: none; max-width: 900px; margin: 0 auto; padding: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn {
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text);
  }
  .tab-btn.active { background: var(--purple); border-color: var(--purple); color: #fff; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 12px;
  }
  .card-title { font-weight: 700; font-size: 14px; margin: 0 0 4px; }
  .card-sub { color: var(--text-secondary); font-size: 12px; margin: 0 0 8px; }
  .card-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
  .pill {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px;
    border-radius: 999px; background: var(--bg); color: var(--text-secondary); margin-right: 6px;
  }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn {
    padding: 7px 14px; border-radius: 8px; border: none; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .btn-approve { background: var(--success); color: #fff; }
  .btn-reject { background: var(--danger); color: #fff; }
  .empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 30px; }
  .id-photo { max-width: 220px; border-radius: 8px; border: 1px solid var(--border); display: block; margin-bottom: 10px; }
  .loading { text-align: center; padding: 30px; color: var(--text-muted); }
  #not-admin { max-width: 420px; margin: 80px auto; text-align: center; color: var(--text-secondary); }
</style>
</head>
<body>

<div id="login-screen">
  <h1>Zuno — Espace admin</h1>
  <p>Connexion réservée aux comptes administrateurs.</p>
  <input type="email" id="login-email" placeholder="Adresse email">
  <input type="password" id="login-password" placeholder="Mot de passe">
  <button class="primary" id="login-btn">Se connecter</button>
  <div id="login-error"></div>
</div>

<div id="not-admin">
  <p>Ce compte n'est pas autorisé à accéder à l'espace admin.</p>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-brand"><div class="logo-icon">Z</div> Zuno — Admin</div>
    <button class="logout-btn" id="logout-btn">Se déconnecter</button>
  </div>
  <div style="padding: 20px;">
    <div class="tabs">
      <button class="tab-btn active" data-tab="litiges">Litiges</button>
      <button class="tab-btn" data-tab="moderation">Modération</button>
      <button class="tab-btn" data-tab="identites">Identités</button>
      <button class="tab-btn" data-tab="publicites">Publicités</button>
      <button class="tab-btn" data-tab="boosts">Mises en avant</button>
      <button class="tab-btn" data-tab="utilisateurs">Utilisateurs</button>
      <button class="tab-btn" data-tab="articles">Articles</button>
      <button class="tab-btn" data-tab="marchands">Marchands</button>
    </div>

    <div class="panel active" id="panel-litiges"><div class="loading">Chargement…</div></div>
    <div class="panel" id="panel-moderation"><div class="loading">Chargement…</div></div>
    <div class="panel" id="panel-identites"><div class="loading">Chargement…</div></div>
    <div class="panel" id="panel-boosts"><div class="loading">Chargement…</div></div>
    <div class="panel" id="panel-utilisateurs"><div class="loading">Chargement…</div></div>
    <div class="panel" id="panel-articles">
      <div class="card" style="margin-bottom: 16px;">
        <input type="text" id="articles-search" placeholder="Rechercher un article (titre)…" oninput="loadArticles()" style="margin-bottom: 10px;">
        <label style="display:block; font-size:12px; color: var(--text-secondary); margin-bottom:6px;">Trier par</label>
        <select id="articles-sort" onchange="loadArticles()" style="width:100%; padding:9px; border-radius:8px; border:1px solid var(--border); font-size:14px;">
          <option value="priority">Priorité (décroissant)</option>
          <option value="recent">Plus récent</option>
          <option value="price_desc">Prix décroissant</option>
          <option value="price_asc">Prix croissant</option>
          <option value="boosted">En vedette d'abord</option>
        </select>
      </div>
      <div id="articles-list"><div class="loading">Chargement…</div></div>
    </div>
    <div class="panel" id="panel-marchands"><div class="loading">Chargement…</div></div>
    <div class="panel" id="panel-publicites">
      <div class="card">
        <p class="card-title" style="margin-bottom: 12px;">Ajouter une publicité</p>
        <input type="text" id="ad-title" placeholder="Titre (facultatif si ton image contient déjà son texte)">
        <input type="text" id="ad-subtitle" placeholder="Sous-titre (facultatif)">
        <label style="display:block; font-size:12px; color: var(--text-secondary); margin-bottom:4px;">Couleur de fond (si pas d'image)</label>
        <input type="color" id="ad-color" value="#2E0B8C" style="height:40px; padding:4px; margin-bottom:10px;">
        <label style="display:block; font-size:12px; color: var(--text-secondary); margin-bottom:4px;">Image (facultative — remplace la couleur si fournie)</label>
        <input type="file" id="ad-image" accept="image/*" style="margin-bottom:14px;">
        <button class="btn btn-approve" id="ad-submit-btn" style="width:100%; padding:11px;" onclick="addAd()">Publier cette bannière</button>
      </div>
      <div id="ads-list"><div class="loading">Chargement…</div></div>
    </div>
  </div>
</div>

<script>
// Remplace ces deux valeurs par celles de ton projet Supabase
// (Project Settings > API dans le tableau de bord Supabase) —
// exactement les mêmes que dans src/lib/supabase.js de l'appli mobile.
const SUPABASE_URL = 'https://pxtapnrcottfulhlezdq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4dGFwbnJjb3R0ZnVsaGxlemRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNDg2MTEsImV4cCI6MjEwNDgyNDYxMX0.RaenFO9NKUkfEuo6RfkNKu22hbXesehm8KDQFFMm4VM';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DISPUTE_LABELS = {
  non_recu: 'Article non reçu',
  non_conforme_description: 'Article non conforme',
  vendeur_injoignable: 'Vendeur injoignable',
  autre: 'Autre problème',
};

document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.style.display = 'none';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    errorEl.textContent = error.message;
    errorEl.style.display = 'block';
    return;
  }
  await checkAdminAndInit();
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

async function checkAdminAndInit() {
  document.getElementById('not-admin').style.display = 'none';
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;

  const { data: adminRow } = await sb.from('admins').select('id').eq('id', user.id).maybeSingle();
  document.getElementById('login-screen').style.display = 'none';

  if (!adminRow) {
    document.getElementById('not-admin').style.display = 'block';
    return;
  }

  document.getElementById('app').style.display = 'block';
  loadLitiges();
  loadModeration();
  loadIdentites();
  loadAds();
  loadBoosts();
  loadUsers();
  loadArticles();
  loadMerchants();
}

async function loadLitiges() {
  const panel = document.getElementById('panel-litiges');
  const { data, error } = await sb
    .from('order_disputes')
    .select('*, orders(id, montant, listings(title), acheteur:users!orders_acheteur_id_fkey(nom, telephone), listings_vendeur:listings(vendeur_id))')
    .eq('status', 'ouvert')
    .order('created_at', { ascending: false });

  if (error) { panel.innerHTML = '<div class="empty">Erreur : ' + error.message + '</div>'; return; }
  if (!data || data.length === 0) { panel.innerHTML = '<div class="empty">Aucun litige en attente.</div>'; return; }

  panel.innerHTML = data.map((d) => `
    <div class="card" data-id="${d.id}">
      <p class="card-title">${d.orders?.listings?.title || 'Annonce'}</p>
      <p class="card-sub">Acheteur : ${d.orders?.acheteur?.nom || '—'} · ${d.orders?.acheteur?.telephone || ''}</p>
      <span class="pill">${DISPUTE_LABELS[d.category] || d.category}</span>
      <span class="pill">${Number(d.orders?.montant || 0).toLocaleString('fr-FR')} FCFA</span>
      ${d.description ? '<p class="card-meta">' + d.description + '</p>' : ''}
      <div class="actions">
        <button class="btn btn-approve" onclick="resolveDispute('${d.id}', 'resolu', '${d.opened_by}')">Marquer résolu</button>
        <button class="btn btn-reject" onclick="resolveDispute('${d.id}', 'rejete', '${d.opened_by}')">Rejeter</button>
      </div>
    </div>
  `).join('');
}

async function resolveDispute(id, status, openedBy) {
  const { error } = await sb.from('order_disputes').update({ status }).eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  await sb.from('notifications').insert({
    user_id: openedBy,
    title: status === 'resolu' ? 'Ton litige a été résolu' : 'Ton litige a été rejeté',
    body: status === 'resolu'
      ? 'Notre équipe a traité ton signalement.'
      : "Après vérification, nous n'avons pas donné suite à ce signalement.",
    type: 'dispute',
    related_id: id,
  });
  loadLitiges();
}

async function loadModeration() {
  const panel = document.getElementById('panel-moderation');
  const { data, error } = await sb
    .from('moderation_queue')
    .select('*, listings(title, price, city, description, vendeur_id)')
    .eq('status', 'pending')
    .order('created_at', { ascending: false });

  if (error) { panel.innerHTML = '<div class="empty">Erreur : ' + error.message + '</div>'; return; }
  if (!data || data.length === 0) { panel.innerHTML = '<div class="empty">Aucune annonce en attente de vérification.</div>'; return; }

  panel.innerHTML = data.map((m) => `
    <div class="card" data-id="${m.id}">
      <p class="card-title">${m.listings?.title || 'Annonce supprimée'}</p>
      <p class="card-sub">${m.listings?.price ? Number(m.listings.price).toLocaleString('fr-FR') + ' FCFA · ' : ''}${m.listings?.city || ''}</p>
      ${m.category ? '<span class="pill">' + m.category + '</span>' : ''}
      <span class="pill">Score ${m.score}</span>
      ${m.detected_keywords?.length ? '<p class="card-meta">Mots détectés : ' + m.detected_keywords.join(', ') + '</p>' : ''}
      ${m.reporter_comment ? '<p class="card-meta">Commentaire du signalement : ' + m.reporter_comment + '</p>' : ''}
      <div class="actions">
        <button class="btn btn-approve" onclick="reviewModeration('${m.id}', '${m.listing_id}', true, '${m.listings?.vendeur_id}')">Approuver l'annonce</button>
        <button class="btn btn-reject" onclick="reviewModeration('${m.id}', '${m.listing_id}', false, '${m.listings?.vendeur_id}')">Retirer l'annonce</button>
      </div>
    </div>
  `).join('');
}

async function reviewModeration(queueId, listingId, approve, vendeurId) {
  const { error: e1 } = await sb.from('moderation_queue')
    .update({ status: approve ? 'reviewed_ok' : 'reviewed_removed' })
    .eq('id', queueId);
  const { error: e2 } = await sb.from('listings')
    .update({ moderation_status: approve ? 'approved' : 'blocked' })
    .eq('id', listingId);
  if (vendeurId && vendeurId !== 'undefined') {
    await sb.from('notifications').insert({
      user_id: vendeurId,
      title: approve ? 'Ton annonce a été approuvée' : 'Ton annonce a été retirée',
      body: approve
        ? 'Elle est de nouveau visible par tous les acheteurs.'
        : "Après vérification, elle ne respecte pas les règles de Zuno.",
      type: 'moderation',
      related_id: listingId,
    });
  }
  if (e1 || e2) { alert('Erreur : ' + (e1 || e2).message); return; }
  loadModeration();
}

async function loadIdentites() {
  const panel = document.getElementById('panel-identites');
  const { data, error } = await sb
    .from('users')
    .select('id, nom, telephone, ville, id_document_url')
    .eq('identity_status', 'en_attente');

  if (error) { panel.innerHTML = '<div class="empty">Erreur : ' + error.message + '</div>'; return; }
  if (!data || data.length === 0) { panel.innerHTML = '<div class="empty">Aucune vérification en attente.</div>'; return; }

  panel.innerHTML = '<div class="loading">Chargement des photos…</div>';
  const cards = await Promise.all(data.map(async (u) => {
    let photoUrl = '';
    if (u.id_document_url) {
      const { data: signed } = await sb.storage.from('identity-documents').createSignedUrl(u.id_document_url, 3600);
      photoUrl = signed?.signedUrl || '';
    }
    return `
      <div class="card" data-id="${u.id}">
        <p class="card-title">${u.nom || 'Sans nom'}</p>
        <p class="card-sub">${u.telephone || ''} · ${u.ville || ''}</p>
        ${photoUrl ? '<img class="id-photo" src="' + photoUrl + '">' : '<p class="card-meta">Aucune photo trouvée.</p>'}
        <div class="actions">
          <button class="btn btn-approve" onclick="reviewIdentity('${u.id}', 'verifiee')">Valider</button>
          <button class="btn btn-reject" onclick="reviewIdentity('${u.id}', 'rejetee')">Rejeter</button>
        </div>
      </div>
    `;
  }));
  panel.innerHTML = cards.join('');
}

async function reviewIdentity(userId, status) {
  const { error } = await sb.from('users').update({ identity_status: status }).eq('id', userId);
  if (error) { alert('Erreur : ' + error.message); return; }
  await sb.from('notifications').insert({
    user_id: userId,
    title: status === 'verifiee' ? 'Identité vérifiée ✅' : 'Identité refusée',
    body: status === 'verifiee'
      ? 'Le badge "Identité vérifiée" est maintenant visible sur ton profil.'
      : "Ta pièce n'a pas pu être validée. Réessaie avec une photo plus lisible.",
    type: 'identity',
    related_id: userId,
  });
  loadIdentites();
}

async function loadAds() {
  const list = document.getElementById('ads-list');
  const { data, error } = await sb.from('ads').select('*').order('position', { ascending: true });

  if (error) { list.innerHTML = '<div class="empty">Erreur : ' + error.message + '</div>'; return; }
  if (!data || data.length === 0) { list.innerHTML = '<div class="empty">Aucune publicité pour l\'instant — celles par défaut de l\'appli restent affichées.</div>'; return; }

  list.innerHTML = data.map((ad) => `
    <div class="card" data-id="${ad.id}">
      ${ad.image_url ? '<div style="width:100%; height:140px; overflow:hidden; border-radius:8px; margin-bottom:10px;"><img src="' + ad.image_url + '" style="width:100%; height:100%; object-fit:cover; display:block;"></div>' : ''}
      <p class="card-title">${ad.title || '(image sans titre)'}</p>
      ${ad.subtitle ? '<p class="card-sub">' + ad.subtitle + '</p>' : ''}
      <span class="pill">${ad.active ? 'Active' : 'Désactivée'}</span>
      <div class="actions">
        <button class="btn btn-approve" onclick="toggleAd('${ad.id}', ${!ad.active})">${ad.active ? 'Désactiver' : 'Activer'}</button>
        <button class="btn btn-reject" onclick="deleteAd('${ad.id}')">Supprimer</button>
      </div>
    </div>
  `).join('');
}

async function addAd() {
  const title = document.getElementById('ad-title').value.trim();
  const subtitle = document.getElementById('ad-subtitle').value.trim();
  const color = document.getElementById('ad-color').value;
  const fileInput = document.getElementById('ad-image');
  const btn = document.getElementById('ad-submit-btn');
  const file = fileInput.files[0];

  if (!title && !file) { alert('Indique au moins un titre ou une image.'); return; }

  btn.disabled = true;
  btn.textContent = 'Envoi…';

  let imageUrl = null;
  if (file) {
    const extension = file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
    const fileName = Date.now() + '.' + extension;
    const { error: uploadError } = await sb.storage.from('ad-images').upload(fileName, file, {
      contentType: file.type || 'image/png',
    });
    if (uploadError) {
      alert('Erreur upload image : ' + uploadError.message);
      btn.disabled = false;
      btn.textContent = 'Publier cette bannière';
      return;
    }
    const { data: pub } = sb.storage.from('ad-images').getPublicUrl(fileName);
    imageUrl = pub.publicUrl;
  }

  const { error } = await sb.from('ads').insert({ title, subtitle, color, image_url: imageUrl, active: true });
  btn.disabled = false;
  btn.textContent = 'Publier cette bannière';

  if (error) { alert('Erreur : ' + error.message); return; }

  document.getElementById('ad-title').value = '';
  document.getElementById('ad-subtitle').value = '';
  fileInput.value = '';
  loadAds();
}

async function toggleAd(id, active) {
  const { error } = await sb.from('ads').update({ active }).eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  loadAds();
}

async function deleteAd(id) {
  if (!confirm('Supprimer définitivement cette publicité ?')) return;
  const { error } = await sb.from('ads').delete().eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  loadAds();
}

async function loadBoosts() {
  const panel = document.getElementById('panel-boosts');
  const { data, error } = await sb
    .from('boost_requests')
    .select('*, listings(title), vendeur:users!boost_requests_vendeur_id_fkey(nom, telephone)')
    .eq('status', 'en_attente')
    .order('created_at', { ascending: false });

  if (error) { panel.innerHTML = '<div class="empty">Erreur : ' + error.message + '</div>'; return; }
  if (!data || data.length === 0) { panel.innerHTML = '<div class="empty">Aucune demande de mise en avant en attente.</div>'; return; }

  panel.innerHTML = data.map((b) => `
    <div class="card" data-id="${b.id}">
      <p class="card-title">${b.listings?.title || 'Annonce'}</p>
      <p class="card-sub">${b.vendeur?.nom || '—'} · ${b.vendeur?.telephone || ''}</p>
      <span class="pill">${b.amount} FCFA · ${b.duration_days} jours</span>
      <div class="actions">
        <button class="btn btn-approve" onclick="confirmBoost('${b.id}', '${b.listing_id}', ${b.duration_days}, '${b.vendeur_id}', '${(b.listings?.title || '').replace(/'/g, "\\'")}')">Paiement reçu</button>
        <button class="btn btn-reject" onclick="rejectBoost('${b.id}', '${b.vendeur_id}', '${(b.listings?.title || '').replace(/'/g, "\\'")}')">Rejeter</button>
      </div>
    </div>
  `).join('');
}

async function confirmBoost(requestId, listingId, durationDays, vendeurId, listingTitle) {
  const boostUntil = new Date(Date.now() + durationDays * 24 * 60 * 60 * 1000).toISOString();
  const { error: e1 } = await sb.from('boost_requests')
    .update({ status: 'paye', confirmed_at: new Date().toISOString() })
    .eq('id', requestId);
  const { error: e2 } = await sb.from('listings').update({ boost_until: boostUntil }).eq('id', listingId);
  if (e1 || e2) { alert('Erreur : ' + (e1 || e2).message); return; }
  await sb.from('notifications').insert({
    user_id: vendeurId,
    title: 'Mise en avant activée 🚀',
    body: '« ' + listingTitle + ' » est maintenant en vedette dans Tendances pour ' + durationDays + ' jours.',
    type: 'boost',
    related_id: listingId,
  });
  loadBoosts();
}

async function rejectBoost(requestId, vendeurId, listingTitle) {
  const { error } = await sb.from('boost_requests').update({ status: 'rejete' }).eq('id', requestId);
  if (error) { alert('Erreur : ' + error.message); return; }
  await sb.from('notifications').insert({
    user_id: vendeurId,
    title: 'Mise en avant refusée',
    body: 'Ta demande pour « ' + listingTitle + ' » n\'a pas pu être confirmée. Contacte-nous si besoin.',
    type: 'boost',
    related_id: requestId,
  });
  loadBoosts();
}

async function loadUsers() {
  const panel = document.getElementById('panel-utilisateurs');

  const [{ data: blockedListings }, { data: disputes }, { data: users }] = await Promise.all([
    sb.from('listings').select('vendeur_id').eq('moderation_status', 'blocked'),
    sb.from('order_disputes').select('order_id, status').eq('status', 'ouvert'),
    sb.from('users').select('id, nom, telephone, is_banned, ban_reason'),
  ]);

  const blockedCounts = {};
  (blockedListings || []).forEach((l) => {
    if (l.vendeur_id) blockedCounts[l.vendeur_id] = (blockedCounts[l.vendeur_id] || 0) + 1;
  });

  // Les litiges sont liés à une commande, pas directement à un vendeur :
  // on ne peut pas les rattacher sans une requête supplémentaire par
  // commande, donc on affiche seulement les annonces bloquées ici pour
  // rester simple — le nombre de litiges se consulte dans l'onglet Litiges.
  const risky = (users || [])
    .map((u) => ({ ...u, blockedCount: blockedCounts[u.id] || 0 }))
    .filter((u) => u.blockedCount > 0 || u.is_banned)
    .sort((a, b) => b.blockedCount - a.blockedCount);

  if (risky.length === 0) {
    panel.innerHTML = '<div class="empty">Aucun compte signalé pour l\'instant.</div>';
    return;
  }

  panel.innerHTML = risky.map((u) => `
    <div class="card" data-id="${u.id}">
      <p class="card-title">${u.nom || 'Sans nom'}</p>
      <p class="card-sub">${u.telephone || ''}</p>
      <span class="pill">${u.blockedCount} annonce(s) bloquée(s)</span>
      ${u.is_banned ? '<span class="pill" style="background:var(--danger); color:#fff;">Compte suspendu</span>' : ''}
      ${u.ban_reason ? '<p class="card-meta">Motif : ' + u.ban_reason + '</p>' : ''}
      <div class="actions">
        ${u.is_banned
          ? `<button class="btn btn-approve" onclick="setBan('${u.id}', false, null)">Réactiver le compte</button>`
          : `<button class="btn btn-reject" onclick="banUser('${u.id}')">Suspendre ce compte</button>`
        }
      </div>
    </div>
  `).join('');
}

async function banUser(userId) {
  const reason = prompt('Motif de la suspension (visible par la personne concernée) :');
  if (reason === null) return;
  await setBan(userId, true, reason);
}

async function setBan(userId, banned, reason) {
  const { error } = await sb.from('users').update({ is_banned: banned, ban_reason: reason }).eq('id', userId);
  if (error) { alert('Erreur : ' + error.message); return; }
  await sb.from('notifications').insert({
    user_id: userId,
    title: banned ? 'Compte suspendu' : 'Compte réactivé',
    body: banned ? (reason || 'Ton compte a été suspendu.') : 'Ton compte est de nouveau actif.',
    type: 'moderation',
  });
  loadUsers();
  loadMerchants();
}

// Reprend automatiquement la session si déjà connecté (évite de se
// reconnecter à chaque ouverture de la page).
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) checkAdminAndInit();
});

// ---------- Articles (toutes les annonces de l'appli) ----------

async function loadArticles() {
  const list = document.getElementById('articles-list');
  const search = (document.getElementById('articles-search')?.value || '').toLowerCase();
  const sortBy = document.getElementById('articles-sort')?.value || 'priority';

  const { data, error } = await sb
    .from('listings')
    .select('*, vendeur:users!listings_vendeur_id_fkey(nom, telephone, boutique_nom, ville)');

  if (error) { list.innerHTML = '<div class="empty">Erreur : ' + error.message + '</div>'; return; }
  if (!data) { list.innerHTML = '<div class="empty">Aucun article.</div>'; return; }

  const now = new Date();
  let filtered = data.filter((l) => !search || l.title?.toLowerCase().includes(search));

  filtered.sort((a, b) => {
    if (sortBy === 'priority') return (b.priority || 0) - (a.priority || 0);
    if (sortBy === 'price_desc') return b.price - a.price;
    if (sortBy === 'price_asc') return a.price - b.price;
    if (sortBy === 'boosted') {
      const aBoost = a.boost_until && new Date(a.boost_until) > now ? 1 : 0;
      const bBoost = b.boost_until && new Date(b.boost_until) > now ? 1 : 0;
      return bBoost - aBoost;
    }
    return new Date(b.created_at) - new Date(a.created_at);
  });

  if (filtered.length === 0) { list.innerHTML = '<div class="empty">Aucun article ne correspond.</div>'; return; }

  list.innerHTML = filtered.map((l) => {
    const isBoosted = l.boost_until && new Date(l.boost_until) > now;
    const isHidden = l.moderation_status === 'blocked';
    return `
    <div class="card" data-id="${l.id}">
      ${l.photo_url ? '<img src="' + l.photo_url + '" style="width:100%; max-height:120px; object-fit:cover; border-radius:8px; margin-bottom:10px;">' : ''}
      <p class="card-title">${l.title}</p>
      <p class="card-sub">${l.vendeur?.boutique_nom || l.vendeur?.nom || 'Vendeur inconnu'} · ${l.city || ''}</p>
      <span class="pill">${Number(l.price).toLocaleString('fr-FR')} FCFA</span>
      <span class="pill">${l.category || ''}</span>
      <span class="pill">${l.condition || ''}</span>
      <span class="pill">${l.status === 'vendu' ? 'Vendu' : l.status === 'annulee' ? 'Annulée' : 'En vente'}</span>
      ${isHidden ? '<span class="pill" style="background:var(--danger); color:#fff;">Masquée</span>' : ''}
      ${isBoosted ? '<span class="pill" style="background:var(--orange); color:#fff;">En vedette</span>' : ''}

      <div id="article-detail-${l.id}" style="display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">
        <p class="card-meta"><strong>Description :</strong> ${l.description || '—'}</p>
        <p class="card-meta"><strong>Lieu :</strong> ${l.city || '—'} · <strong>Délai livraison :</strong> ${l.delai_livraison || '—'}</p>
        <p class="card-meta"><strong>Vendeur :</strong> ${l.vendeur?.nom || '—'} · ${l.vendeur?.telephone || '—'} · ${l.vendeur?.ville || ''}</p>
        <p class="card-meta"><strong>Score de modération :</strong> ${l.moderation_score ?? 0}${l.moderation_flags?.length ? ' · signaux : ' + l.moderation_flags.map(f => f.matched || f).join(', ') : ''}</p>
        <div id="article-history-${l.id}"><p class="card-meta">Chargement de l'historique…</p></div>
      </div>

      <div style="margin-top:10px; display:flex; align-items:center; gap:8px;">
        <label style="font-size:12px; color: var(--text-secondary);">Priorité :</label>
        <input type="number" value="${l.priority || 0}" style="width:70px; padding:6px; border:1px solid var(--border); border-radius:6px;"
          onchange="updatePriority('${l.id}', this.value)">
      </div>
      <div class="actions">
        <button class="btn btn-approve" onclick="toggleArticleDetail('${l.id}')">Voir détails</button>
        <button class="btn btn-approve" onclick="boostFromAdmin('${l.id}')">${isBoosted ? 'Prolonger 3j' : 'Mettre en avant 3j'}</button>
        <button class="btn ${isHidden ? 'btn-approve' : 'btn-reject'}" onclick="toggleArticleVisibility('${l.id}', ${isHidden})">${isHidden ? 'Afficher' : 'Masquer'}</button>
        <button class="btn btn-reject" onclick="deleteArticleAdmin('${l.id}')">Supprimer</button>
      </div>
    </div>
  `;
  }).join('');
}

async function toggleArticleDetail(id) {
  const el = document.getElementById('article-detail-' + id);
  if (!el) return;
  const opening = el.style.display === 'none';
  el.style.display = opening ? 'block' : 'none';
  if (!opening) return;

  const historyEl = document.getElementById('article-history-' + id);
  const { data, error } = await sb
    .from('moderation_logs')
    .select('*')
    .eq('listing_id', id)
    .order('created_at', { ascending: false });

  if (error || !data || data.length === 0) {
    historyEl.innerHTML = '<p class="card-meta">Aucun historique de modération.</p>';
    return;
  }
  historyEl.innerHTML = '<p class="card-meta"><strong>Historique :</strong></p>' + data.map((h) =>
    '<p class="card-meta">' + new Date(h.created_at).toLocaleString('fr-FR') + ' — ' + h.action + ' (' + h.actor_type + ')</p>'
  ).join('');
}

async function updatePriority(id, value) {
  const { error } = await sb.from('listings').update({ priority: parseInt(value, 10) || 0 }).eq('id', id);
  if (error) alert('Erreur : ' + error.message);
}

async function boostFromAdmin(id) {
  const boostUntil = new Date(Date.now() + 3 * 24 * 60 * 60 * 1000).toISOString();
  const { error } = await sb.from('listings').update({ boost_until: boostUntil }).eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  loadArticles();
}

async function toggleArticleVisibility(id, currentlyHidden) {
  const { error } = await sb.from('listings')
    .update({ moderation_status: currentlyHidden ? 'approved' : 'blocked' })
    .eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  loadArticles();
}

async function deleteArticleAdmin(id) {
  if (!confirm('Supprimer définitivement cet article ? Cette action échouera si des commandes y sont déjà liées.')) return;
  const { error } = await sb.from('listings').delete().eq('id', id);
  if (error) { alert("Impossible de supprimer : " + error.message + " (probablement des commandes déjà liées à cet article — utilise \"Masquer\" à la place)"); return; }
  loadArticles();
}

// ---------- Marchands (profil, solde, ventes, commandes) ----------

let merchantsData = {};

async function loadMerchants() {
  const panel = document.getElementById('panel-marchands');

  const [{ data: users }, { data: listings }, { data: orders }] = await Promise.all([
    sb.from('users').select('id, nom, telephone, ville, photo_url, boutique_nom, is_banned, ban_reason, identity_status'),
    sb.from('listings').select('id, vendeur_id, status, moderation_status'),
    sb.from('orders').select('montant, listing_id, deliveries(statut_livraison), listings!inner(vendeur_id)'),
  ]);

  if (!users || !listings) { panel.innerHTML = '<div class="empty">Erreur de chargement.</div>'; return; }

  const sellerIds = new Set(listings.map((l) => l.vendeur_id).filter(Boolean));
  const merchants = users.filter((u) => sellerIds.has(u.id));

  const stats = {};
  merchants.forEach((m) => {
    stats[m.id] = {
      totalListings: 0, activeListings: 0, soldListings: 0, hiddenListings: 0,
      aTraiter: 0, prisEnCharge: 0, enCours: 0, livre: 0, annulee: 0, revenue: 0,
    };
  });
  listings.forEach((l) => {
    if (!stats[l.vendeur_id]) return;
    stats[l.vendeur_id].totalListings++;
    if (l.status === 'disponible') stats[l.vendeur_id].activeListings++;
    if (l.status === 'vendu') stats[l.vendeur_id].soldListings++;
    if (l.moderation_status === 'blocked') stats[l.vendeur_id].hiddenListings++;
  });
  (orders || []).forEach((o) => {
    const vendeurId = o.listings?.vendeur_id;
    if (!vendeurId || !stats[vendeurId]) return;
    const status = o.deliveries?.[0]?.statut_livraison;
    if (status === 'livre') { stats[vendeurId].revenue += Number(o.montant || 0); stats[vendeurId].livre++; }
    else if (status === 'a_traiter') stats[vendeurId].aTraiter++;
    else if (status === 'pris_en_charge') stats[vendeurId].prisEnCharge++;
    else if (status === 'en_cours') stats[vendeurId].enCours++;
    else if (status === 'annulee') stats[vendeurId].annulee++;
  });

  const sorted = merchants.sort((a, b) => stats[b.id].revenue - stats[a.id].revenue);
  merchantsData = {};
  sorted.forEach((m) => { merchantsData[m.id] = { ...m, stats: stats[m.id] }; });

  if (sorted.length === 0) { panel.innerHTML = '<div class="empty">Aucun marchand pour l\'instant.</div>'; return; }

  panel.innerHTML = sorted.map((m) => {
    const s = stats[m.id];
    return `
    <div class="card" data-id="${m.id}">
      <p class="card-title">${m.boutique_nom || m.nom || 'Sans nom'}</p>
      <p class="card-sub">${m.telephone || ''}${m.ville ? ' · ' + m.ville : ''}</p>
      <span class="pill">Solde : ${s.revenue.toLocaleString('fr-FR')} FCFA</span>
      <span class="pill">${s.soldListings} vendu(s)</span>
      <span class="pill">${s.activeListings} en ligne</span>
      ${s.hiddenListings > 0 ? '<span class="pill">' + s.hiddenListings + ' masquée(s)</span>' : ''}
      <span class="pill">${m.identity_status === 'verifiee' ? 'Identifié' : 'Non identifié'}</span>
      ${m.is_banned ? '<span class="pill" style="background:var(--danger); color:#fff;">Suspendu</span>' : ''}

      <div id="merchant-detail-${m.id}" style="display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">
        <p class="card-meta">Commandes — À traiter : ${s.aTraiter} · Pris en charge : ${s.prisEnCharge} · Expédiées : ${s.enCours} · Livrées : ${s.livre} · Annulées : ${s.annulee}</p>
        ${m.is_banned && m.ban_reason ? '<p class="card-meta">Motif de suspension : ' + m.ban_reason + '</p>' : ''}
      </div>

      <div class="actions">
        <button class="btn btn-approve" onclick="toggleMerchantDetail('${m.id}')">Voir le profil</button>
        <button class="btn ${s.hiddenListings === s.totalListings && s.totalListings > 0 ? 'btn-approve' : 'btn-reject'}"
          onclick="toggleShopVisibility('${m.id}', ${s.hiddenListings === s.totalListings && s.totalListings > 0})">
          ${s.hiddenListings === s.totalListings && s.totalListings > 0 ? 'Afficher la boutique' : 'Masquer la boutique'}
        </button>
        ${m.is_banned
          ? `<button class="btn btn-approve" onclick="setBan('${m.id}', false, null)">Réactiver</button>`
          : `<button class="btn btn-reject" onclick="banUser('${m.id}')">Suspendre</button>`
        }
      </div>
    </div>
  `;
  }).join('');
}

function toggleMerchantDetail(id) {
  const el = document.getElementById('merchant-detail-' + id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function toggleShopVisibility(vendeurId, currentlyHidden) {
  const { error } = await sb.from('listings')
    .update({ moderation_status: currentlyHidden ? 'approved' : 'blocked' })
    .eq('vendeur_id', vendeurId);
  if (error) { alert('Erreur : ' + error.message); return; }
  loadMerchants();
}
}
